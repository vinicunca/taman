services:
  # Local database
  db:
    image: postgres:18
    container_name: taman-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taman_db
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taman_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taman_data:/var/lib/postgresql

volumes:
  taman_data:
