strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false
minimumReleaseAge: 0

publicHoistPattern:
  - lefthook
  - eslint
  - oxfmt
  - oxlint
  - stylelint
  - '*postcss*'
  - '@commitlint/*'
  - czg

packages:
  - internal/*
  - packages/*
  - packages/@core/base/*
  - apps/*

overrides:
  pinia: 'catalog:'
  vue: 'catalog:'

catalog:
  '@vinicunca/eslint-config': 5.1.0
  '@vitejs/plugin-vue': ^6.0.7
  '@vitejs/plugin-vue-jsx': ^5.1.5
  eslint: ^10.4.0
  is-ci: ^4.1.0
  lefthook: ^2.1.8
  pinia: ^3.0.4
  pinia-plugin-persistedstate: ^4.7.1
  sass: ^1.99.0
  stylelint: ^17.12.0
  stylelint-config-recess-order: ^7.7.0
  stylelint-config-recommended: ^18.0.0
  stylelint-config-recommended-scss: ^17.0.1
  stylelint-config-recommended-vue: ^1.6.1
  stylelint-config-standard: ^40.0.0
  stylelint-order: ^8.1.1
  stylelint-scss: ^7.1.1
  turbo: ^2.9.14
  typescript: ^6.0.3
  vite: 8.0.10
  vitest: ^4.1.7
  vue: ^3.5.34
  vue-i18n: ^11.4.4
  vue-router: ^5.0.7

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  vue-demi: true
