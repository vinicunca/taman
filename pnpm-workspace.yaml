strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false
minimumReleaseAge: 0

publicHoistPattern:
  - lefthook
  - eslint
  - oxfmt
  - oxlint
  - stylelint
  - '*postcss*'
  - '@commitlint/*'
  - czg

packages:
  - internal/*
  - packages/*
  - packages/@core/base/*
  - apps/*
  - scripts/*

overrides:
  pinia: 'catalog:'
  vue: 'catalog:'

catalog:
  '@clack/prompts': ^1.4.0
  '@internationalized/date': ^3.12.1
  '@intlify/core-base': ^11.4.4
  '@intlify/unplugin-vue-i18n': ^11.2.3
  '@jspm/generator': ^2.15.0
  '@manypkg/get-packages': ^3.1.0
  '@pnpm/workspace.read-manifest': ^1000.3.1
  '@stylistic/stylelint-plugin': ^5.2.0
  '@types/archiver': ^7.0.0
  '@types/html-minifier-terser': ^7.0.2
  '@types/node': ^25.9.1
  '@vinicunca/eslint-config': 5.1.0
  '@vitejs/plugin-vue': ^6.0.7
  '@vitejs/plugin-vue-jsx': ^5.1.5
  archiver: ^7.0.1
  cac: ^7.0.0
  chalk: ^5.6.2
  cheerio: ^1.2.0
  consola: ^3.4.2
  dotenv: ^17.4.2
  eslint: ^10.4.0
  execa: ^9.6.1
  get-port: ^7.2.0
  h3: ^1.15.11
  html-minifier-terser: ^7.2.0
  is-ci: ^4.1.0
  lefthook: ^2.1.8
  nitropack: ^2.13.4
  pinia: ^3.0.4
  pinia-plugin-persistedstate: ^4.7.1
  pkg-types: ^2.3.1
  postcss: ^8.5.15
  postcss-html: ^1.8.1
  rollup-plugin-visualizer: ^7.0.1
  stylelint: ^17.12.0
  stylelint-config-recess-order: ^7.7.0
  stylelint-config-recommended: ^18.0.0
  stylelint-config-recommended-vue: ^1.6.1
  stylelint-config-standard: ^40.0.0
  stylelint-order: ^8.1.1
  tsdown: ^0.22.0
  turbo: ^2.9.14
  typescript: ^6.0.3
  unocss: ^66.7.0
  unplugin-dts: ^1.0.1
  vite: 8.0.10
  vite-plugin-compression: ^0.5.1
  vite-plugin-pwa: ^1.3.0
  vite-plugin-vue-devtools: ^8.1.2
  vitest: ^4.1.7
  vue: ^3.5.34
  vue-i18n: ^11.4.4
  vue-router: ^5.0.7

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  vue-demi: true

'@stylistic/stylelint-plugin': ^5.2.0
