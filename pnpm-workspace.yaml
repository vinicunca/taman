ignoreWorkspaceRootCheck: true
includeWorkspaceRoot: true
catalogMode: prefer
minimumReleaseAge: 0
autoInstallPeers: true
dedupePeerDependents: true
strictPeerDependencies: false
shellEmulator: true
verifyDepsBeforeRun: false
nodeVersion: 22.22.3
engineStrict: true

packages:
  - internal/*
  - internal/lint-configs/*
  - packages/*
  - packages/shell/*
  - packages/server/*
  - packages/shared/*
  - apps/*
  - scripts/*

overrides:
  '@ast-grep/napi': 'catalog:'
  '@ctrl/tinycolor': 'catalog:'
  '@types/pg': 'catalog:'
  '@vue/compiler-sfc': 'catalog:'
  clsx: 'catalog:'
  pinia: 'catalog:'
  pohon-ui: 'catalog:'
  unocss: 'catalog:'
  vue: 'catalog:'

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  nx: true
  pnpm: true
  sharp: true
  vue-demi: true
  workerd: true

